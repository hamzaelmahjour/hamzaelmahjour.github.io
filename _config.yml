title: "Hamza El Mahjour"
url: "https://hamzaelmahjour.github.io"
baseurl: ""
lang: en
timezone: Africa/Casablanca
email: h.elmahjour@uae.ac.ma
description: >-
  Hamza El Mahjour, lecturer-researcher in applied mathematics at ENSA Tangier
  (Abdelmalek Essaâdi University). Course materials, interactive quizzes and
  research on mathematical epidemiology.

author:
  name: "Hamza El Mahjour"
  role: "Lecturer-researcher in applied mathematics at ENSA Tangier, Abdelmalek Essaâdi University"
  bio: >-
    I teach probability, algebra, mathematics for economics and stochastic
    calculus. My research applies mathematics to epidemics: stochastic and
    fractional-order models, bifurcations and optimal control.
  photo: /assets/images/profile.jpg
  links:
    - label: "ENSAT"
      icon: "fa-solid fa-building-columns"
      url: "https://ensat.ac.ma/Portail/liste-des-enseignant-du-departement-sic/"
    - label: "ORCID"
      icon: "fa-brands fa-orcid"
      url: "https://orcid.org/0000-0002-7081-2114"
    - label: "Scopus"
      icon: "fa-solid fa-database"
      url: "https://www.scopus.com/authid/detail.uri?authorId=6504193814"
    - label: "GitHub"
      icon: "fa-brands fa-github"
      url: "https://github.com/hamzaelmahjour"
    - label: "X"
      icon: "fa-brands fa-x-twitter"
      url: "https://x.com/PrElMahjour"

twitter:
  username: PrElMahjour
social:
  name: Hamza El Mahjour
  links:
    - https://x.com/PrElMahjour
    - https://github.com/hamzaelmahjour
    - https://orcid.org/0000-0002-7081-2114

google_analytics: G-0MMQG077KJ
formspree_id: mzzrpoor

# ─── Build ───────────────────────────────────────────────────
markdown: kramdown
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge
sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

include:
  - _pages
exclude:
  - GUIDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache

permalink: /news/:year/:title/

collections:
  teaching:
    output: true
  research:
    output: true
    permalink: /research/:title/
  quizzes:
    output: true
    permalink: /quiz/:name/

defaults:
  - scope: { path: "" }
    values: { layout: page }
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: teaching }
    values: { layout: course, math: true }
  - scope: { path: "", type: research }
    values: { layout: paper, math: true }
  - scope: { path: "", type: quizzes }
    values: { layout: quiz, math: true, lang: fr }
