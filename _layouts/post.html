---
layout: default
---
<article class="wrap page">
  <p class="crumbs"><a href="{{ '/news/' | relative_url }}">News</a></p>
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    <p class="lede">{% if page.dates %}{{ page.dates }}{% else %}{{ page.date | date: '%-d %B %Y' }}{% endif %}{% if page.location %}<br>{{ page.location }}{% endif %}</p>
  </header>
  <div class="prose">
    {{ content }}
    {%- if page.link %}<p><a class="btn" href="{{ page.link }}" target="_blank" rel="noopener">{{ page.link_label | default: 'More details' }}</a></p>{% endif -%}
  </div>
</article>
