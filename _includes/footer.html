<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-id">
      <p class="footer-name">{{ site.author.name }}</p>
      <p><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
    </div>
    <ul class="footer-links">
      {%- for l in site.author.links -%}
      <li><a href="{{ l.url }}" rel="me noopener" target="_blank"><i class="{{ l.icon }}" aria-hidden="true"></i>{{ l.label }}</a></li>
      {%- endfor -%}
    </ul>
    <p class="footer-legal">
      © {{ site.time | date: '%Y' }} {{ site.author.name }}. Documents and videos are shared under
      <a href="{{ '/license/' | relative_url }}">CC BY-NC-ND 4.0</a>.
      <a href="{{ '/feedback/' | relative_url }}">Leave feedback</a>
    </p>
  </div>
</footer>
