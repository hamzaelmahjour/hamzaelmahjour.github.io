# Concept catalog used by the quiz diagnosis.
#
# In a quiz, tag a question with   @ concept-id   (several ids: @ id1, id2).
# When a student misses questions, the end of the quiz lists the weak concepts
# with the links below.
#
#   label:  what the student sees
#   cours:  link to the matching section of your course (#s2 = sequence 2)
#   links:  external resources. Either a direct  url:  or a  search:  (a Google
#           search restricted to that site, e.g. Bibmath). To point to an exact
#           Bibmath page, replace  search: "..."  by  url: "https://www.bibmath.net/..."
#
# Exo7 links were taken from Exo7's own sources (github.com/exo7math):
# chapter PDFs from the cours-exo7 repository, solved exercise sheets (ficpdf)
# as referenced by the Exo7 chapters themselves.

