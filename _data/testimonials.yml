- quote: I'm one of your former students. You taught us probability in our second year at ENSA Tanger, and I'm now in GINF2. A few days ago some classmates and I were talking about our first years at the school, your name came up, and we remembered you had a website. We looked it up, and I'm really glad we did. We tried some of the quizzes together and had a great time. They were fun, and they were also a good test of how much we still remember (some of it, less than we thought!). The videos impressed me too, especially the Manim ones. "Probability zero and still possible?!" is the kind of idea that's hard to get across on a blackboard, and the animation makes it click. One small suggestion;  the Probabilités et Statistiques course has only one quiz for now. A few more would help current students a lot, and nostalgic former ones like us too. Thank you for the effort you put into your teaching and for sharing all of this openly.
  from: Former Student
